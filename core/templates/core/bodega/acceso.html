{% extends "core/bodega/base.html" %}
{% block titulo %}Acceso de bodega{% endblock %}
{% block cuerpo %}
<div class="desk angosto">
  <div class="desk-head">
    <div><h1>Bodega de producto terminado</h1><div class="sub">Recepción de devoluciones</div></div>
  </div>
  <div class="desk-body">
    {% if form.errors %}
      <div class="aviso error">Usuario o contraseña incorrectos.</div>
    {% endif %}
    <form method="post">
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ request.GET.next }}">
      <div class="campo">
        <label for="id_username">Usuario</label>
        <input type="text" name="username" id="id_username" autocomplete="username" autocapitalize="none" required autofocus value="{{ form.username.value|default:'' }}">
      </div>
      <div class="campo">
        <label for="id_password">Contraseña</label>
        <input type="password" name="password" id="id_password" autocomplete="current-password" required>
      </div>
      <button class="btn-pri ancho" type="submit">Entrar</button>
    </form>
  </div>
</div>
{% endblock %}
