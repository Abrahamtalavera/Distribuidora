<style>
  .desk { max-width:1180px; }
  .nav-dia { display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
  .nav-dia a, .nav-dia button { background:rgba(255,255,255,.18); color:#fff; border:none; border-radius:6px; padding:6px 10px; font-size:13px; text-decoration:none; cursor:pointer; font-family:inherit; }
  .nav-dia input[type=date] { border:none; border-radius:6px; padding:5px 8px; font-size:13px; font-family:inherit; }
  .barra { display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:12px; }
  .barra h2 { font-size:15px; margin:0; color:var(--primary-dark); }
  .barra .nota { font-size:12px; color:var(--muted); }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:10px; margin-bottom:18px; }
  .tile { border:1px solid var(--border); border-radius:10px; padding:12px 14px; background:#fff; }
  .tile .t { font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.03em; }
  .tile .n { font-size:24px; font-weight:700; margin:4px 0 2px; color:var(--text); }
  .tile .n small { font-size:13px; font-weight:600; color:var(--muted); }
  .tile .m { font-size:13px; color:var(--muted); }
  .tile ul { list-style:none; margin:8px 0 0; padding:8px 0 0; border-top:1px solid #f0f0f0; font-size:12.5px; }
  .tile li { display:flex; justify-content:space-between; gap:8px; padding:2px 0; }
  .tile li span:last-child { font-weight:600; white-space:nowrap; }
  .tile.malo { border-color:#f2b8b5; background:var(--danger-bg); }
  .tile.bueno .n { color:var(--ok); }
  .estados { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
  .badge-ruta { background:var(--warn-bg); color:var(--warn); }
  .badge-terminada { background:var(--accent-light); color:var(--primary-dark); }
  details.alerta { border:1px solid var(--border); border-radius:10px; margin-bottom:10px; background:#fff; }
  details.alerta > summary { list-style:none; cursor:pointer; padding:12px 14px; display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  details.alerta > summary::-webkit-details-marker { display:none; }
  details.alerta > summary::before { content:"▸"; color:var(--muted); font-size:12px; }
  details.alerta[open] > summary::before { content:"▾"; }
  details.alerta .tit { font-weight:700; font-size:14px; flex:1; min-width:200px; }
  details.alerta .ayuda { font-size:12px; color:var(--muted); padding:0 14px 8px; }
  details.alerta .cuerpo { padding:0 14px 12px; }
  details.alerta.error { border-left:4px solid var(--danger); }
  details.alerta.warn { border-left:4px solid var(--warn); }
  .cuenta { font-size:13px; font-weight:700; padding:3px 10px; border-radius:12px; }
  .cuenta.error { background:var(--danger-bg); color:var(--danger); }
  .cuenta.warn { background:var(--warn-bg); color:var(--warn); }
  .monto-alerta { font-size:13px; color:var(--muted); font-weight:600; }
  .mas { font-size:12px; color:var(--muted); margin-top:8px; }
  .sin-alertas { display:flex; flex-wrap:wrap; gap:8px; margin-top:4px; }
  .sin-alertas span { font-size:12px; background:var(--ok-bg); color:var(--ok); padding:4px 10px; border-radius:12px; }
  td a { color:var(--primary-dark); font-weight:700; text-decoration:none; }
  td a:hover { text-decoration:underline; }
  .pestanas { display:flex; gap:2px; background:var(--primary-dark); padding:0 20px; overflow-x:auto; }
  .pestanas a { color:#cfe0e8; text-decoration:none; font-size:13px; font-weight:600; padding:10px 14px; border-bottom:3px solid transparent; white-space:nowrap; }
  .pestanas a.activa { color:#fff; border-bottom-color:#f7c948; }
  .usuario a { color:#fff; font-size:12px; }
</style>
