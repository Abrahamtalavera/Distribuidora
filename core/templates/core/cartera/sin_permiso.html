{% extends "core/bodega/base.html" %}
{% block titulo %}Sin permiso{% endblock %}
{% block cuerpo %}
<div class="desk angosto">
  <div class="desk-head"><div><h1>Cartera</h1></div></div>
  <div class="desk-body">
    <div class="aviso error">El usuario <b>{{ request.user.get_username }}</b> no tiene permiso para revisar devoluciones. Pide en oficina que lo agreguen al grupo "Cartera".</div>
    <form method="post" action="{% url 'cartera_salir' %}">
      {% csrf_token %}
      <button class="btn-pri ancho" type="submit">Entrar con otro usuario</button>
    </form>
  </div>
</div>
{% endblock %}
