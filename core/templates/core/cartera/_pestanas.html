{% comment %}Cambios #33 y #36: pestañas de la consulta de cartera.{% endcomment %}
<style>
  .pestanas { display:flex; gap:2px; background:var(--primary-dark); padding:0 20px; overflow-x:auto; }
  .pestanas a { color:#D2D4F0; text-decoration:none; font-size:13px; font-weight:600; padding:10px 14px; border-bottom:3px solid transparent; white-space:nowrap; }
  .pestanas a:hover { color:#fff; }
  .pestanas a.activa { color:#fff; border-bottom-color:var(--accent, #E97324); }
</style>
<nav class="pestanas">
  <a href="{% url 'cartera_cargas' %}" class="{% if pestana == 'cargas' %}activa{% endif %}">Consulta de cargas</a>
  <a href="{% url 'cartera_lista' %}" class="{% if pestana != 'cargas' and pestana != 'imprimir' %}activa{% endif %}">Revisión de devoluciones</a>
  <a href="{% url 'cartera_imprimir' %}" class="{% if pestana == 'imprimir' %}activa{% endif %}">Imprimir cierre de carga</a>
</nav>
